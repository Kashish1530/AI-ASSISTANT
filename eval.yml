name: eval

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  eval:
    # Secrets aren't available to PRs from forks, so skip those
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agentic-ai-proj     
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DRY_RUN_EMAIL: "true"         # CI must never send real email
      READ_ROOT: data
      EVAL_MIN_PASS_RATE: "0.8"     # the build fails below this
      EVAL_SLEEP_SECONDS: "2"       # stay under free-tier rate limits
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: DAY5/requirements.txt

      - run: pip install -r requirements.txt

      # PRs run a quick subset (2 per type = 12 cases); main runs all 30
      - name: Run eval suite
        run: python eval_suite.py ${{ github.event_name == 'pull_request' && '--per-type 2' || '' }}

      - name: Publish report to job summary
        if: always()
        run: cat logs/eval_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            DAY5/logs/eval_report.json
            DAY5/logs/eval_report.md
            DAY5/logs/audit.jsonl

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t capstone-agent DAY5
